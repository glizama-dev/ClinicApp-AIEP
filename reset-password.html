<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña | ClinicApp</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="description" content="Crea una nueva contraseña para tu cuenta de ClinicApp.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <main class="auth-page">
    <div class="modal auth-page__card">
      <a href="index.html" class="logo auth-page__logo">
        <span class="logo__icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        ClinicApp
      </a>

      <form class="auth-form" id="resetForm">
        <h3>Crear nueva contraseña</h3>
        <p class="auth-form__subtitle">Ingresa tu nueva contraseña para completar la recuperación de tu cuenta.</p>

        <div class="form-group">
          <label for="resetPassword">Nueva contraseña</label>
          <div class="password-field">
            <input type="password" id="resetPassword" name="password" placeholder="Mínimo 8 caracteres, letras y números" minlength="8" required autocomplete="new-password">
            <button type="button" class="password-toggle" data-target="resetPassword" aria-label="Mostrar contraseña"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>

        <div class="form-group">
          <label for="resetPasswordConfirm">Confirma tu nueva contraseña</label>
          <div class="password-field">
            <input type="password" id="resetPasswordConfirm" name="passwordConfirm" placeholder="Repite la contraseña" minlength="8" required autocomplete="new-password">
            <button type="button" class="password-toggle" data-target="resetPasswordConfirm" aria-label="Mostrar contraseña"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn--block">Guardar nueva contraseña</button>
        <p class="form-success" id="resetSuccess" hidden>Tu contraseña fue actualizada. Ya puedes iniciar sesión.</p>
        <p class="auth-form__error" id="resetError" hidden></p>
        <a href="index.html" class="link-small">Volver al inicio</a>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
